version: '3.8'

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: nudge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nudge_user
      POSTGRES_PASSWORD: nudge_pass
      POSTGRES_DB: nudge_db
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    ports:
      - 3000:3000
    env_file: .env
volumes:
  postgres_data:
